<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشروعي الطبي والصحي</title>
    
    <!-- تنسيقات CSS الخاصة بالصفحة -->
    <style>
        html {
            scroll-behavior: smooth;
        }
        * {
    box-sizing: border-box;
}

body > div, body > header, body > section, body > form {
    width: 92%;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
} }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f4f9f9; /* لون خلفية هادئ ومريح */
            color: #333333; /* لون النص الأساسي */
            margin: 0;
            padding: 20px;
            direction: rtl;
            text-align: center;
        }

        /* تنسيق العناوين */
        h1, p {
            color: #ffffff;
        }
        
        h2 {
            color: #084f78;
            text-align: center;
        }

        /* تنسيق الصناديق أو الأقسام */
        .section {
            background-color: #084f78;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 3px 7px rgba(227, 227, 227, 0.34);
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        .info-box {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 800px;
            margin: 40px auto;
            text-align: right;
        }

        /* تنسيق الروابط والأزرار */
        a {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 15px;
            transition: all 0.3s ease;
            display: inline-block;
        }

        a:hover {
            color: #ffffff;
            background-color: #084f78;
            box-shadow: 0 4px 8px rgba(8, 79, 120, 0.2);
        }

        a:active {
            transform: scale(0.98);
        }

        /* تنسيق التجاوب مع الهواتف (الهوامش الجانبية المريحة) */
        @media screen and (max-width: 768px) {
            body {
                padding: 15px !important; /* يترك هامشاً على اليمين واليسار لشاشة الموبايل */
            }

            .section, .info-box {
                width: 100% !important;
                padding: 15px !important;
                margin: 15px auto !important;
            }

            /* جعل صندوق بطاقة الدكتور يعرض عمودياً على الموبايل */
            .doctor-container {
                flex-direction: column !important;
                width: 100% !important;
                padding: 15px !important;
                text-align: center;
            }

            .doctor-container img {
                margin-bottom: 15px;
                float: none !important;
            }

            .doctor-text {
                text-align: center !important;
            }

            textarea {
                width: 100% !important;
            }
        }
    </style>
</head>
<body>

    <!-- الترويسة العلوية -->
    <div class="section">
        <h1>Welcome To Dr.T.Morad.com</h1>
    </div>
    
    <hr style="border: 0.5px solid #ddd; max-width: 900px; margin: 20px auto;">

    <!-- بطاقة التعريف بالدكتور -->
    <div class="doctor-container" style="display: flex; flex-direction: row; margin-top: 20px; align-items: center; justify-content: center; gap: 20px; padding: 25px; background-color: #ffffff; border-radius: 25px; max-width: 800px; margin-left: auto; margin-right: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
        
        <!-- الصورة -->
        <img src="1212.jpg" alt="صورة توضيحية" style="width: 160px; height: 160px; border-radius: 50%; object-fit: cover; flex-shrink: 0;">
        
        <!-- النصوص -->
        <div class="doctor-text" style="direction: rtl; text-align: right;">
            <h3 style="color: #028090; margin-bottom: 15px; margin-top: 0;">الدكتور طارق زياد مراد</h3>
            <ul style="padding-right: 20px; color: #333;">
                <li style="margin-bottom: 10px;">أخصائي في أمراض الدم و الأورام</li>
                <li style="margin-bottom: 10px;">حائز على شهادة البورد الأمريكي في أمراض الدم والأورام</li>
                <li style="margin-bottom: 10px;">عضو الجمعية الأمريكية لأمراض الدم والأورام</li>
            </ul>
        </div>
    </div> 
    
    <br>

    <!-- زر الانتقال -->
    <div style="background-color: #084f78; width: 250px; text-align: center; margin: 0 auto; border-radius: 50px; height: 45px; display: flex; align-items: center; justify-content: center;">
        <nav>
            <a href="#111">انتقل للفحوص المطلوبة</a>
        </nav>
    </div>

    <h2 style="margin-top: 30px;">للتسجيل في الأسفل</h2>
    <article style="font-size: 20px; color: #084f78; margin-bottom: 15px;">
        فقر الدم أنواع
    </article>

    <!-- صندوق نموذج الاستشارة -->
    <div class="info-box">
        <h2 style="text-align: center; color: #084f78; margin-bottom: 35px;">تسجيل طلب استشارة أونلاين</h2>
        
        <form>
            <label for="student_name" style="font-weight: bold; color: #084f78;">اسم الطالب الكامل:</label><br>
            <input type="text" id="student_name" placeholder="أدخل اسمك الثلاثي" required style="width: 100%; padding: 12px; margin: 8px 0 20px 0; border: 1px solid #ccc; border-radius: 6px;"><br>

            <label for="student_phone" style="font-weight: bold; color: #084f78;">رقم الهاتف / واتساب:</label><br>
            <input type="tel" id="student_phone" placeholder="09xxxxxxxx" required style="width: 100%; padding: 12px; margin: 8px 0 20px 0; border: 1px solid #ccc; border-radius: 6px;"><br>

            <label for="student_landline" style="font-weight: bold; color: #084f78;">رقم الهاتف الأرضي:</label><br>
            <input type="tel" id="student_landline" placeholder="011.." required style="width: 100%; padding: 12px; margin: 8px 0 20px 0; border: 1px solid #ccc; border-radius: 6px;"><br>
            
            <label for="telegram_user" style="font-weight: bold; color: #084f78;">اسم المعرف على تليغرام:</label><br>
            <input type="text" id="telegram_user" placeholder="الاسم على تليغرام" style="width: 100%; padding: 12px; margin: 8px 0 20px 0; border: 1px solid #ccc; border-radius: 6px;"><br>

            <label style="font-weight: bold; color: #084f78; display: block; margin-bottom: 10px; font-size: 18px;">اختر باقة الاشتراك المفضلة:</label>
            
            <input type="radio" id="package1" name="course_package" value="full">
            <label for="package1">الباقة الشاملة (منهاج البكالوريا كاملاً + بنك الأسئلة)</label><br><br>
            
            <input type="radio" id="package2" name="course_package" value="first_term">
            <label for="package2">فصل أول فقط (الوحدات الأولى)</label><br><br>
            
            <input type="radio" id="package3" name="course_package" value="second_term">
            <label for="package3">فصل ثاني فقط (الوحدات اللاحقة)</label><br><br>

            <div style="margin: 20px 0;">
                <input type="checkbox" id="whatsapp_group" name="join_whatsapp">
                <label for="whatsapp_group">أرغب بالانضمام إلى مجموعة الواتساب الخاصة بالطلاب المشتركين لمتابعة الإشعارات</label>
            </div>

            <label for="student_notes" style="font-weight: bold; color: #084f78; font-size: 18px;">هل لديك أي استفسار أو صعوبة معينة في مادة الأحياء تود إخبار الدكتور بها؟</label><br>
            <textarea id="student_notes" rows="4" placeholder="اكتب استفسارك هنا..." style="width: 100%; padding: 12px; margin: 8px 0 20px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 15px;"></textarea><br>

            <div style="text-align: center;">
                <button type="submit" style="background-color: #084f78; color: white; padding: 12px 35px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold;">إرسال طلب التسجيل</button>
            </div>
        </form>
    </div>

    <!-- صندوق الفحوصات المطلوبة -->
    <div id="111" class="info-box">
        <label style="font-weight: bold; color: #084f78; display: block; margin-bottom: 15px; font-size: 22px;">الفحوصات المطلوب إجراؤها:</label><br>

        <div style="margin: 15px 0;">
            <input type="checkbox" id="test-cbc" name="tests" value="cbc">
            <label style="font-size: 18px; color: #084f78;" for="test-cbc">صورة دم كاملة (CBC)</label><br>
        </div>

        <div style="margin: 15px 0;">
            <input type="checkbox" id="test-iron" name="tests" value="Ferritin & Iron Profile">
            <label style="font-size: 18px; color: #084f78;" for="test-iron">مخزون الحديد والمناعة (Ferritin & Iron Profile)</label><br><br>
        </div>

        <hr style="border: 0.5px solid #eee; margin: 20px 0;">

        <div>
            <label style="font-size: 18px; color: #084f78; font-weight: bold;" for="medical-history">التاريخ المرضي والأعراض الحالية:</label><br>
            <textarea style="margin-top: 15px; font-size: 15px; width: 100%; max-width: 600px; padding: 10px; border: 1px solid #ccc; border-radius: 6px;" id="medical-history" name="history" rows="4" placeholder="اذكر هنا الأعراض وأي أدوية سيولة تتناولها حالياً..."></textarea><br><br> 
        </div>
    </div>

</body>
</html>
